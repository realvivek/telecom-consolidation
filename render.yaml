# Render Blueprint — deploy by connecting this repo at
# https://dashboard.render.com/blueprints
#
# Static ES modules with no build step, so this publishes the repository root
# as-is. Once connected, pushes to the watched branch deploy automatically.
services:
  - type: web
    runtime: static
    name: telecom-consolidation
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # three.js is vendored and versioned by path, so it can be cached hard.
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page and its modules change with every deploy; let the CDN
      # revalidate rather than serve a stale bundle against fresh data.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
